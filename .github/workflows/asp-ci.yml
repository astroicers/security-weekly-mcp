# ⚠️ 由 `asp render ci` 產生 — 勿手改(單一事實源:asp-gate.yaml)
# source sha256: 2d0071e3a1c0440d6b40ad1c6bacf77470d11a90b6f7cd5dfb76d0c8773e5f91
name: asp-ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]  # 可信段觸發(§7:僅 merged 碼)
  merge_group: {}  # merge queue rebase 後重跑
permissions: read-all  # PR job 零 secrets(ADR-000 §7 兩段式)
jobs:
  gate:
    name: gate
    if: github.event_name != 'push'
    runs-on: [self-hosted, swm-pr]  # 無 docker、無密鑰(D2 複製)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # commit-format 需非 merge commit 歷史(PR ref 為合成 merge)
      - name: gate(committed 渲染物,與本地同一份 → 判定一致)
        run: bash .asp/gate.sh
  megalinter:
    if: github.event_name == 'push'  # 可信段:僅 merged 碼(D2)
    runs-on: [self-hosted, swm-trusted]  # 有 docker,僅 push
    steps:
      - name: clean root-owned leftovers（自架:上一輪 MegaLinter 容器留的 root 檔(.ruff_cache 等))
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:latest sh -c 'rm -rf /w/..?* /w/.[!.]* /w/* 2>/dev/null || true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: MegaLinter（需 docker）
        uses: oxsecurity/megalinter/flavors/python@15e5b45552097e318c93de385779ce3b1084052c  # v10.0.0
