# ⚠️ 由 `asp render ci` 產生 — 勿手改(單一事實源:asp-gate.yaml)
# source sha256: 7cd45c24767e09ac1c79365ec37df60694c7f455dfd919939576001e89d02485
name: asp-ci
on:
  pull_request:
    branches: [develop, main]
permissions: read-all  # PR job 零 secrets(ADR-000 §7 兩段式)
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest  # P2 改自架 ephemeral runner(ADR-000 §7)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # commit-format 需非 merge commit 歷史(PR ref 為合成 merge)
      - name: gate(committed 渲染物,與本地同一份 → 判定一致)
        run: bash .asp/gate.sh
  megalinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/python@15e5b45552097e318c93de385779ce3b1084052c  # v10.0.0
        env:
          # 映像 digest 佔位欄位:P2 vendored base image 落地後填實(AC-1)
          MEGALINTER_IMAGE_DIGEST: "sha256:TBD-P2-vendoring"
